name: Build, Test & Publish to Maven Central

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.0.0 - leave empty to use tag/default)'
        required: false
        type: string

jobs:
  build-and-test:
    name: Build & Test (kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Build and Tests
        run: ./gradlew check build

  publish-and-release:
    name: Publish to Maven Central & Release
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Extract Version from Tag
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION#v}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
          else
            VERSION="0.1.0"
            TAG_NAME="v${VERSION}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG_NAME=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION} (Tag: ${TAG_NAME})"

      - name: Prepare Signing Key
        env:
          RAW_KEY: ${{ secrets.SIGNING_KEY || secrets.PGP_SECRET || secrets.GPG_SIGNING_KEY }}
        run: |
          if [ -z "$RAW_KEY" ]; then
            echo "::error::SIGNING_KEY / PGP_SECRET secret is missing!"
            exit 1
          fi

          if echo "$RAW_KEY" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
            KEY="$RAW_KEY"
          else
            DECODED=$(echo "$RAW_KEY" | base64 -d 2>/dev/null || true)
            if echo "$DECODED" | grep -q "BEGIN PGP PRIVATE KEY BLOCK"; then
              KEY="$DECODED"
            else
              KEY="$RAW_KEY"
            fi
          fi

          KEY=$(echo "$KEY" | sed 's/\\n/\n/g')

          {
            echo "PARSED_SIGNING_KEY<<EOF"
            echo "$KEY"
            echo "EOF"
          } >> $GITHUB_ENV

      - name: Publish to Maven Central Portal
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME || secrets.SONATYPE_USERNAME || secrets.OSSRH_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD || secrets.SONATYPE_PASSWORD || secrets.OSSRH_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ env.PARSED_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD || secrets.PGP_PASSPHRASE || secrets.GPG_PASSWORD }}
        run: |
          ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache -Pversion="${{ steps.get_version.outputs.VERSION }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.get_version.outputs.TAG_NAME }}
          name: Release ${{ steps.get_version.outputs.TAG_NAME }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
