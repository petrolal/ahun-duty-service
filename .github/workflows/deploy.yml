name: Build and Deploy to Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write
  id-token: write # required to mint the GitHub OIDC token for GCP Workload Identity Federation

env:
  GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'casa-ahun' }}
  GCP_REGION: us-central1
  ARTIFACT_REGISTRY_REPO: ahun-duty-service
  SERVICE_NAME: ahun-duty-service

jobs:
  # -------------------------------------------------------------------------
  # Stage 1 - detect whether GCP credentials are configured, resolve version
  # -------------------------------------------------------------------------
  setup:
    name: Setup
    runs-on: ubuntu-latest
    environment: GCP_SA_KEY
    outputs:
      version: ${{ steps.ver.outputs.version }}
      have_gcp: ${{ steps.gcp.outputs.have_gcp }}
    steps:
      - name: Resolve version
        id: ver
        run: echo "version=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Detect GCP config
        id: gcp
        run: |
          echo "have_gcp=${{ (secrets.WIF_PROVIDER != '' && secrets.WIF_SERVICE_ACCOUNT != '') || secrets.GCP_SA_KEY != '' || secrets.GOOGLE_CREDENTIALS != '' || secrets.GCP_CREDENTIALS != '' }}" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # Stage 2 - run the test suite
  # -------------------------------------------------------------------------
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Test Suite
        run: ./gradlew test --no-daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  # -------------------------------------------------------------------------
  # Stage 3 - build the container image and push it to Artifact Registry
  # -------------------------------------------------------------------------
  image:
    name: Build & Push Image
    needs: [setup, test]
    if: needs.setup.outputs.have_gcp == 'true'
    runs-on: ubuntu-latest
    environment: GCP_SA_KEY
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:latest
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ needs.setup.outputs.version }}
            ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------------
  # Stage 4 - provision the service infrastructure, then deploy the image
  # -------------------------------------------------------------------------
  deploy:
    name: Provision infra & deploy to Cloud Run
    needs: [setup, image]
    if: needs.setup.outputs.have_gcp == 'true'
    runs-on: ubuntu-latest
    environment: GCP_SA_KEY
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"

      # ---- Terraform (gcp/ in this repo): create/update the Cloud Run service,
      #      its Artifact Registry repo, service accounts and IAM. Image is
      #      ignored by Terraform and rolled out by the deploy step below.
      #      Backend bucket + prefix and service_name are hardcoded in gcp/main.tf.
      - name: Provision service infrastructure
        working-directory: gcp
        env:
          TF_VAR_project_id: ${{ env.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ env.GCP_REGION }}
          TF_VAR_spring_datasource_url: ${{ secrets.SPRING_DATASOURCE_URL }}
          TF_VAR_spring_datasource_password: ${{ secrets.SPRING_DATASOURCE_PASSWORD }}
          TF_VAR_telegram_chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          TF_VAR_bot_token_secret_id: ${{ secrets.BOT_TOKEN_SECRET_ID }}
          TF_VAR_github_actions_sa_email: ${{ secrets.WIF_SERVICE_ACCOUNT }}
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/${{ env.SERVICE_NAME }}:${{ needs.setup.outputs.version }} \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --quiet
