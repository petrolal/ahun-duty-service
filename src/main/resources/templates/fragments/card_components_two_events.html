<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Shared Card Styles Fragment -->
    <style th:fragment="cardStyles">
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Position container over card text boxes */
        .fields-container {
            position: absolute;
            top: 535px;
            left: 0;
            display: flex;
            flex-direction: column;
            width: 1080px;
            height: 622px;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 41px;
            padding: 20px 60px 41px 60px;
        }

        .date-text {
            display: flex;
            justify-content: center;
            text-align: center;
            color: #3a1e05;
            width: 960px;
            height: 92px;
            font-size: 64px;
            font-weight: bold;
            line-height: 96.8%;
        }

        .information-text {
            font-size: 40px;
            font-weight: bold;
            text-align: center;
            color: #3a1e05;
            width: 575px;
            height: 123px;
            margin-top: -10px; /* Pushes element strictly to the bottom */
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.2px;
        }

        .event-item {
            font-size: 44px;
            font-weight: 600;
            color: #3a1e05;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 960px;
            height: 110px;
            text-align: center;
            padding: 10px;
        }

        .event-separator {
            margin: 0 12px;
        }

        .event-time {
            color: #6b3e14;
        }

        .event-name {
            color: #3a1e05;
        }
    </style>
</head>
<body>

<!-- Shared Card Fields Fragment -->
<div th:fragment="cardFields" class="fields-container">
        <!-- Campo Data -->
        <span class="date-text" th:text="${date}"></span>

        <div class="event-item" th:each="event : ${events}" th:if="${event.visibleInCard}">
            <span class="event-name" th:text="${event.name}"></span>
            <span class="event-separator">-</span>
            <span class="event-time" th:text="${event.time}"></span>
        </div>

        <span class="information-text" th:text="${description}"></span>
</div>

</body>
</html>
