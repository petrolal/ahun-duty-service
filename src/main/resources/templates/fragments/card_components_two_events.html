<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- Shared Card Styles Fragment -->
    <style th:fragment="cardStyles">
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Position container over card text boxes */
        .fields-container {
            opacity: 0.3;
            background-color: red;
            position: absolute;
            top: 540px;
            left: 0;
            display: flex;
            flex-direction: column;
            width: 1080px;
            height: 601px;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px 60px 41px 60px;
        }

        .date-box {
            display: flex;
            align-items: baseline;
            justify-content: center;
            text-align: center;
            color: #3a1e05;
            width: 960px;
            height: 92px;
            margin: 0 auto 10px auto;
        }

        .date-text {
            font-size: 64px;
            color: #3a1e05;
            font-weight: bold;
            letter-spacing: 1px;
            text-align: center;
            display: inline-block;
            width: 100%;
        }

        .event-item {
            background-color: rebeccapurple;
            font-size: 40px;
            font-weight: 600;
            color: #3a1e05;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 960px;
            height: 111px;
            margin: 0 auto 15px auto;
            text-align: center;
            padding: 10px;
        }

        .event-time {
            color: #6b3e14;
        }

        .event-name {
            color: #3a1e05;
        }
    </style>
</head>
<body>

<!-- Shared Card Fields Fragment -->
<div th:fragment="cardFields" class="fields-container">
        <!-- Campo Data -->
        <div class="date-box" th:if="${date != null and !date.empty}">
            <span class="date-text" th:text="${date}"></span>
        </div>

        <div class="event-item" th:each="event : ${events}" th:if="${event.visibleInCard}">
            <span class="event-name" th:text="${event.name}"></span>
            <span class="event-separator">-</span>
            <span class="event-time" th:text="${event.time}"></span>
        </div>

        <div class="information-box">
            <span class="date-text" th:text="${date}"></span>
        </div>
    </div>

</body>
</html>
