<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 1080px;
            height: 1350px;
            font-family: 'Arial', sans-serif;
            position: relative;
            overflow: hidden;
        }
        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 1080px;
            height: 1350px;
            z-index: 1;
        }
        .card-content {
            position: relative;
            z-index: 2;
            width: 1080px;
            height: 1350px;
        }
    </style>
    <style th:replace="~{fragments/card_components :: cardStyles}"></style>
</head>
<body>

    <!-- Background Image tag for full FlyingSaucer and Browser rendering compatibility -->
    <img class="card-bg" th:src="${bgImageDataUri != null and !bgImageDataUri.isEmpty()} ? ${bgImageDataUri} : '/images/' + (${bgImageName != null ? bgImageName : 'gira_de_exu_e_cura_2.png'})" alt="Background Card"/>

    <div class="card-content">
        <!-- Reusable Card Fields Fragment -->
        <div th:replace="~{fragments/card_components :: cardFields}"></div>
    </div>

</body>
</html>
